# Rollout plan: what the ML engineer hands to the platform team before a rollout.
# Check it with `make release-check`.

model:
  candidate: v2   # the store version to release (`make store-list`)
  replaces: v1    # the store version that serves now

strategy: canary  # chosen in the lecture: the lab's platform cannot store shadow answers

canary:
  percent: 10     # the canary percentage: the percentage of requests the candidate gets, a whole number from 1 to 50

smoke:
  # the smoke test's behaviour check: how far apart the probabilities for the clearly
  # ill and the healthy test patient must be, a number between 0 and 1
  min_probability_spread: 0.1

load:
  expected_rps: 20     # requests per second you expect at the busiest hour
  max_p95_ms: 300       # the p95 latency the service must stay under at that load
  max_error_rate: 0.01   # the share of failed requests you accept, between 0 and 1

promote:
  when:
    - no failed smoke checks for 24 hours
    - error rate stays below 1 percent for 24 hours

rollback:
  when:
    - any smoke check fails
    - error rate exceeds 1 percent
